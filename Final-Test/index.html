<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Tictactoe</title>
</head>
<body>
    <div class="turn-label">Lượt người chơi: <span id="turnDisplay">x</span></div>
    <div id="title" class="playing">Bấm bắt đầu để chơi</div>
    <div id="subtitle"></div>
    <div class="board" id="board"></div>
    <div class="controls">
        <button id="startBtn">Bắt đầu</button>
        <button id="replayBtn" disabled>Chơi lại</button>
    </div>
    <script src="./index.js"></script>
</body>
</html>
